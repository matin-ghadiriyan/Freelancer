{% extends "base.html" %}
{% block title %}تماس با ما — {{ site_name }}{% endblock %}

{% block content %}
<section class="page-head">
  <div class="container">
    <h1>تماس با ما</h1>
    <p class="muted">سؤالی دارید؟ تیم پشتیبانی ما آماده کمک است.</p>
  </div>
</section>

<section class="section">
  <div class="container contact-grid">
    <div class="card contact-info">
      <h2>راه‌های ارتباطی</h2>
      <ul class="list">
        <li class="list-item"><span class="stat-icon">✉️</span> support@freelancino.ir</li>
        <li class="list-item"><span class="stat-icon">📞</span> ۰۲۱-۱۲۳۴۵۶۷۸</li>
        <li class="list-item"><span class="stat-icon">📍</span> تهران، خیابان آزادی</li>
      </ul>
    </div>

    <form method="post" class="card form-stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <h2>ارسال پیام</h2>
      <label>نام شما *
        <input type="text" name="name" required />
      </label>
      <label>ایمیل *
        <input type="email" name="email" required />
      </label>
      <label>پیام *
        <textarea name="message" rows="6" required></textarea>
      </label>
      <button class="btn btn-primary btn-lg" type="submit">ارسال پیام</button>
    </form>
  </div>
</section>
{% endblock %}
